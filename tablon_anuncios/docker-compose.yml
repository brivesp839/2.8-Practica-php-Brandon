services:

  web:
    image: php:8.3-apache

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tablon_anuncios
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    restart: always

    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin

    environment:
      PMA_HOST: db

    ports:
      - "8082:80"

    depends_on:
      - db

volumes:
  db_data: