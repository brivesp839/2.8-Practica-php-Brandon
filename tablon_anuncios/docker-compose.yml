services:

  web:
    image: php:8.3-apache

    ports:
      - "8080:80"
    
    command: >
      bash -c "docker-php-ext-install pdo_mysql
      && sed -i 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf
      && sed -i 's!/var/www/!/var/www/html/public!g' /etc/apache2/apache2.conf
      && apache2-foreground"

    volumes:
      - .:/var/www/html

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    restart: always

    volumes:
      - db_data:/var/lib/mysql
      #Hago que la base de datos se cargue de manera automática con docker
      # Todo .sql en esta carpeta se ejecuta al crear la base de datos por primera vez
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  phpmyadmin:
    image: phpmyadmin

    environment:
      PMA_HOST: db

    ports:
      - "8082:80"

    depends_on:
      - db

#Cargo de manera automática la base de datos con docker
volumes:
  db_data: