services:

  web:
    image: php:8.3-apache

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    restart: always

    volumes:
      - db_data:/var/lib/mysql
      #Hago que la base de datos se cargue de manera automática con docker
      # Todo .sql en esta carpeta se ejecuta al crear la base de datos por primera vez
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  phpmyadmin:
    image: phpmyadmin

    environment:
      PMA_HOST: db

    ports:
      - "8082:80"

    depends_on:
      - db

#Cargo de manera automática la base de datos con docker
volumes:
  db_data: